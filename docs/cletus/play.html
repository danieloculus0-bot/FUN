/* Cletus opening key art. Keep the illustration intact and make START the focal point. */
.game-overlay[data-testid="overlay-menu"]{
  background:linear-gradient(to bottom,#100d1e0a 60%,#0b0719df 96%),
    url("../Cletus%20Saves%20Candy_%20Neon%20City%20Rescue.png") center center / contain no-repeat,
    #120d1d;
  align-items:end;
}
.game-overlay[data-testid="overlay-menu"] .overlay-card{
  width:min(600px,100%);padding:8px 20px 14px;
  background:#100a18d8;border:1px solid #a56285;
  box-shadow:0 10px 24px #07050ca8;
}

html.cletus-key-art-ready .game-overlay[data-testid="overlay-menu"] .overlay-copy,
html.cletus-key-art-ready .game-overlay[data-testid="overlay-menu"] .overlay-kicker,
html.cletus-key-art-ready .game-overlay[data-testid="overlay-menu"] .story-line{

}
.game-overlay[data-testid="overlay-menu"] .primary-button{margin:auto;max-width:100%;}

.touch-controls .shoulder{grid-row:1;align-self:start;justify-self:center;width:min(90%,145px);height:28px;margin-top:max(5px,env(safe-area-inset-top));z-index:3}
.touch-controls .shoulder-left{grid-column:1}.touch-controls .shoulder-right{grid-column:3}
.touch-controls .system-pad{position:absolute;bottom:max(3px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:auto;display:flex;flex-direction:row;gap:12px;z-index:4}
.touch-controls .system-key{width:73px;height:23px;min-height:23px}
.touch-controls .pad-legend{display:none}
.game-overlay .overlay-card{padding:5px;max-height:100%}
.game-overlay .overlay-title{font-size:clamp(17px,4vw,32px)}.game-overlay .overlay-copy{font-size:10px}
}
@media(pointer:coarse) and (max-width:1180px) and (orientation:landscape) and (max-height:345px){
.game-column{grid-template-columns:clamp(100px,16vw,150px) minmax(0,1fr) clamp(100px,16vw,150px)}
.touch-controls .dpad,.touch-controls .action-pad{width:min(80%,115px,40dvh);margin-top:9px}
.touch-controls .shoulder{height:23px;margin-top:2px}.touch-controls .system-pad{bottom:2px}
.touch-controls .system-key{height:20px;min-height:20px;font-size:8px}
}


/* Portable copy: keep a readable game menu when cover PNG isn't alongside HTML. */
html:not(.cletus-key-art-ready) .game-overlay[data-testid="overlay-menu"]{
  background:radial-gradient(circle at 50% 15%,#4b275d,#1b1026 57%,#090710);
  place-items:center;align-items:center;
}
html:not(.cletus-key-art-ready) .game-overlay[data-testid="overlay-menu"] .overlay-card{
  padding:clamp(12px,4vw,30px);border:2px solid #a56285;
  background:#100a18f2;max-width:min(92%,560px);
}
html:not(.cletus-key-art-ready) .game-overlay[data-testid="overlay-menu"] .overlay-title{
  font-size:clamp(26px,5.8vw,57px);line-height:.95;white-space:normal;
}
html:not(.cletus-key-art-ready) .game-overlay[data-testid="overlay-menu"] .overlay-copy{
  margin:10px auto;font-size:clamp(12px,2.2vw,16px);
}
html:not(.cletus-key-art-ready) .game-overlay[data-testid="overlay-menu"] .story-line{
  max-width:350px;margin:10px auto 16px;
}

<script>
(function(){
let t;
function tip(msg){let e=document.getElementById('fullscreen-hint');if(!e){e=document.createElement('div');e.id='fullscreen-hint';e.setAttribute('role','status');document.body.appendChild(e)}
e.textContent=msg;Object.assign(e.style,{position:'fixed',zIndex:'1000',left:'10%',right:'10%',bottom:'max(12px,env(safe-area-inset-bottom))',padding:'12px',border:'2px solid #ffd46c',background:'#170e22',color:'#ffe6bd',font:'bold 13px/1.4 system-ui',textAlign:'center'});clearTimeout(t);t=setTimeout(()=>e.remove(),6000)}
window.cletusFullscreen=function(){if(document.fullscreenElement){document.exitFullscreen?.();return}const root=document.getElementById('root');if(root&&root.requestFullscreen){try{const p=root.requestFullscreen({navigationUI:'hide'});if(p&&p.catch)p.catch(()=>tip('For iPhone full-screen play: open in Safari, Share, Add to Home Screen.'));return}catch(e){}}
tip('For iPhone full-screen play: open in Safari, tap Share, Add to Home Screen, and launch Cletus from your Home Screen.')};
document.addEventListener('touchmove',e=>{if(matchMedia('(pointer:coarse) and (max-width:1180px)').matches&&e.cancelable)e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',e=>{if(e.target.closest('.touch-controls,.game-canvas'))e.preventDefault()});
})();
</script>
<script>
/* Key art is optional in copies of this single-file game.
   Hide menu text only when the external cover has actually loaded. */
(function(){
 const art=new Image();
 art.onload=()=>document.documentElement.classList.add('cletus-key-art-ready');
 art.onerror=()=>document.documentElement.classList.remove('cletus-key-art-ready');
 art.src='../Cletus%20Saves%20Candy_%20Neon%20City%20Rescue.png';
})();
</script>
