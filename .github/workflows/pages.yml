name: FUN browser game regression tests

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tests/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "tests/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: node --check docs/game.js
      - name: Verify Emperor Gauntlet gameplay
        run: node tests/web-smoke.cjs
      - name: Verify Cletus Saves Candy gameplay and mobile controls
        run: node tests/cletus-smoke.cjs
