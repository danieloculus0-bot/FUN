name: BEAN Emperor second 3000 learning matches
on:
  push:
    branches:
      - experiment/bean-emperor-qledger-20261020
    paths:
      - emperor-gauntlet/bean-6000-*.cjs
      - .github/workflows/bean-emperor-6000.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  training:
    name: 500 real-game matches / shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore last 3000-game merged BEAN Q-policy and complete decision ledger
        uses: actions/download-artifact@v4
        with:
          repository: danieloculus0-bot/FUN
          run-id: 39545071171
          name: bean-emperor-3000-complete-evidence
          path: previous
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify trainer syntax and original physics adapter
        run: |
          node --check emperor-gauntlet/bean-6000-worker.cjs
          node --test tests/bean-q-learning.test.cjs tests/bean-game-adapter.test.cjs
      - name: Run 500 genuine new matches with reward-driven Q updates and full decision ledger
        env:
          BEAN_SHARD: ${{ matrix.shard }}
          BEAN_PARENT_DIR: previous
        run: node emperor-gauntlet/bean-6000-worker.cjs
      - name: Preserve Q-checkpoint and every gameplay decision
        uses: actions/upload-artifact@v4
        with:
          name: bean-6k-shard-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}/
          retention-days: 90
          if-no-files-found: error
  reconcile:
    name: Reconcile 3000 matches and independently evaluate Q-policy
    needs: training
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore BEAN 3000 merged Q-policy and full history
        uses: actions/download-artifact@v4
        with:
          repository: danieloculus0-bot/FUN
          run-id: 39545071171
          name: bean-emperor-3000-complete-evidence
          path: previous
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore original BEAN 24-kill champion
        uses: actions/download-artifact@v4
        with:
          repository: danieloculus0-bot/FUN
          run-id: 39543055899
          name: bean-emperor-learning-benchmark
          path: champion
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore all six newly trained Q-checkpoints and episode ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: bean-6k-shard-*
          path: training-shards
          merge-multiple: false
      - name: Validate 3000 recorded episodes, aggregate learned values, compare unseen matches
        env:
          BEAN_SHARD_ROOT: training-shards
          BEAN_PARENT_DIR: previous
          BEAN_CHAMPION_DIR: champion
        run: |
          node --check emperor-gauntlet/bean-6000-aggregate.cjs
          node emperor-gauntlet/bean-6000-aggregate.cjs
      - name: Preserve full 6350-game learning history and Q snapshots
        uses: actions/upload-artifact@v4
        with:
          name: bean-emperor-6000-full-evidence
          path: |
            bean-emperor-6000-summary.json
            bean-emperor-6000-ledger.jsonl
            bean-emperor-6000-full-history.jsonl
            bean-emperor-6000-evaluation.jsonl
            bean-emperor-6000-policy-*.json
          retention-days: 90
          if-no-files-found: error
