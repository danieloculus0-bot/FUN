name: BEAN Emperor 3000 ledger reconciliation
on:
  push:
    branches:
      - experiment/bean-emperor-qledger-20261020
    paths:
      - .github/workflows/bean-emperor-3000-reconcile.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download 350-episode saved Q and historical ledger
        uses: actions/download-artifact@v4
        with:
          repository: danieloculus0-bot/FUN
          run-id: 39543978578
          name: bean-emperor-continued-ledger-and-policy
          path: previous
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download original 24-kill champion Q
        uses: actions/download-artifact@v4
        with:
          repository: danieloculus0-bot/FUN
          run-id: 39543055899
          name: bean-emperor-learning-benchmark
          path: champion
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse all six completed 500-game training ledgers
        uses: actions/download-artifact@v4
        with:
          repository: danieloculus0-bot/FUN
          run-id: 39544727605
          pattern: bean-3k-shard-*
          path: training-shards
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate all 3000 decisions and score learned Q vs champions
        env:
          BEAN_SHARD_ROOT: training-shards
          BEAN_PARENT_DIR: previous
          BEAN_CHAMPION_DIR: champion
        run: |
          node --check emperor-gauntlet/bean-3000-aggregate.cjs
          node emperor-gauntlet/bean-3000-aggregate.cjs
      - name: Preserve complete evidence without repeating a training match
        uses: actions/upload-artifact@v4
        with:
          name: bean-emperor-3000-complete-evidence
          path: |
            bean-emperor-3000-summary.json
            bean-emperor-3000-ledger.jsonl
            bean-emperor-3000-full-history.jsonl
            bean-emperor-3000-evaluation.jsonl
            bean-emperor-3000-policy-*.json
          retention-days: 90
          if-no-files-found: error
