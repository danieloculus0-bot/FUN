name: BEAN Emperor continued learning from previous ledger
on:
  push:
    branches:
      - experiment/bean-emperor-qledger-20261020
    paths:
      - emperor-gauntlet/bean-continue.cjs
      - .github/workflows/bean-emperor-continue.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  ledger-replay-and-train:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download exact prior 150-episode ledger and trained policy
        uses: actions/download-artifact@v4
        with:
          repository: danieloculus0-bot/FUN
          run-id: 39543055899
          name: bean-emperor-learning-benchmark
          path: original-run
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check continuity script syntax and reference Q tests
        run: |
          node --check emperor-gauntlet/bean-continue.cjs
          node --test tests/bean-q-learning.test.cjs tests/bean-game-adapter.test.cjs
      - name: Resume learned Q policy, replay full ledger, train more, test same holdout
        env:
          BEAN_RESUME_DIR: original-run
          BEAN_EXTRA_TRAIN: '200'
          BEAN_HOLDOUT: '32'
        run: node emperor-gauntlet/bean-continue.cjs
      - name: Retain complete historic and new decision ledgers and Q policy
        uses: actions/upload-artifact@v4
        with:
          name: bean-emperor-continued-ledger-and-policy
          path: |
            bean-emperor-continued-benchmark.json
            bean-emperor-full-chain-ledger.jsonl
            bean-emperor-continued-policy.json
            bean-emperor-previous-policy.json
          retention-days: 90
