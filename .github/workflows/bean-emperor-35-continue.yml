name: BEAN reproduce and extend the exact 35 kill game
on:
  push:
    branches:
      - experiment/bean-emperor-qledger-20261020
    paths:
      - .github/workflows/bean-emperor-35-continue.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reproduce-exact-35-game:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load original parent Q policy from first 3000-game batch
        uses: actions/download-artifact@v4
        with:
          repository: danieloculus0-bot/FUN
          run-id: 39545071171
          name: bean-emperor-3000-complete-evidence
          path: previous
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Load exact 35-kill decision ledger
        uses: actions/download-artifact@v4
        with:
          repository: danieloculus0-bot/FUN
          run-id: 39546036769
          name: bean-emperor-6000-full-evidence
          path: last
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Recreate earlier Q history and verify identical 160 decisions
        env:
          BEAN_PARENT_DIR: previous
          BEAN_LATEST_LEDGER: last/bean-emperor-6000-full-history.jsonl
        run: |
          node --check emperor-gauntlet/bean-35-continue.cjs
          node emperor-gauntlet/bean-35-continue.cjs
      - name: Preserve exact reproduction outcome
        uses: actions/upload-artifact@v4
        with:
          name: bean-35-exact-game-continuation
          path: bean-emperor-35-continued.json
          retention-days: 90
          if-no-files-found: error
