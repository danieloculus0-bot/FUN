name: BEAN diagnose Emperor Gauntlet deaths and learned actions
on:
  push:
    branches:
      - experiment/bean-emperor-qledger-20261020
    paths:
      - .github/workflows/bean-emperor-cause-audit.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download complete 6350-episode authoritative ledger
        uses: actions/download-artifact@v4
        with:
          repository: danieloculus0-bot/FUN
          run-id: 39546036769
          name: bean-emperor-6000-full-evidence
          path: previous
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check and examine every recorded termination and decision
        env:
          BEAN_LEDGER_FILE: previous/bean-emperor-6000-full-history.jsonl
        run: |
          node --check emperor-gauntlet/bean-cause-audit.cjs
          node emperor-gauntlet/bean-cause-audit.cjs
      - name: Retain the complete diagnostic breakdown
        uses: actions/upload-artifact@v4
        with:
          name: bean-emperor-cause-diagnosis
          path: bean-emperor-cause-diagnosis.json
          retention-days: 90
          if-no-files-found: error
